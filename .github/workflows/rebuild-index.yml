name: Rebuild sticker index

on:
  push:
    branches: [main]
    paths:
      - "stickers/**"
      - "metadata.json"
      - "scripts/rebuild_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index
        run: python scripts/rebuild_index.py
      - name: Commit generated index when changed
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: update sticker index"
            git push
          fi
